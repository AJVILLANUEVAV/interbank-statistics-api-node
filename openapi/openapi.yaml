openapi: 3.0.3
info:
  title: Interbank Statistics API
  version: 1.0.0
  description: Calculates aggregate statistics for matrices produced by the Matrix API.
servers:
  - url: http://localhost:8081
    description: Local Docker Compose
  - url: https://interbank-statistics-api-node.onrender.com
    description: Render production
paths:
  /health:
    get:
      summary: Health check
      operationId: getStatisticsHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /internal/v1/statistics:
    post:
      summary: Calculate statistics for named matrices
      operationId: calculateStatistics
      description: Internal endpoint called by the Matrix API over the Docker network.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatisticsRequest'
            example:
              matrices:
                rotatedMatrix: [[4, 1], [5, 2], [6, 3]]
                q: [[-0.6, 0.8], [-0.8, -0.6]]
                r: [[-5, -2.2], [0, -0.4]]
      responses:
        '200':
          description: Statistics by matrix name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '400':
          description: Missing, empty, or non-rectangular matrix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Matrix:
      type: array
      minItems: 1
      items:
        type: array
        minItems: 1
        items:
          type: number
          format: double
    StatisticsRequest:
      type: object
      required: [matrices]
      properties:
        matrices:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Matrix'
    Statistics:
      type: object
      required: [min, max, average, sum, isDiagonal]
      properties:
        min: { type: number, format: double }
        max: { type: number, format: double }
        average: { type: number, format: double }
        sum: { type: number, format: double }
        isDiagonal: { type: boolean }
    StatisticsResponse:
      type: object
      required: [statistics]
      properties:
        statistics:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Statistics'
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
